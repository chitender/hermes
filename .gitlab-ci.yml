
include:
  - project: 'chitendra/innovaccer-ci-templates'
    ref: main
    file: 'templates/main.yml'

variables:
  # ── Image identity ─────────────────────────────────────────────────────────
  DOCKER_IMAGE: "hermes"          # e.g. auth-service
  DOCKERFILE_PATH: "Dockerfile"              # relative path to Dockerfile
  INNO_GITLAB_WRITE_TOKEN: $PRIVATE_GITLAB_TOKEN

  # ── ECR ────────────────────────────────────────────────────────────────────
  CI_ECR_REGISTRY: "728921286627.dkr.ecr.us-east-1.amazonaws.com"
  DEV_ECR_PREFIX: "dev"
  INTEGRATION_ECR_PREFIX: "integration"
  PROD_ECR_PREFIX: "prod"
  AWS_DEFAULT_REGION: "us-east-1"

  # ── Helm deployment targeting ───────────────────────────────────────────────
  PRODUCT: "infra"                        # top-level key in values.yaml
  MICROSERVICE_NAME: "hermes"     # key under PRODUCT

  # ── Optional ───────────────────────────────────────────────────────────────
  MULTI_ARCH_BUILD: "true"                  # set "true" to also build ARM64
  IMAGE_SCAN_MAX_CRITICAL: "0"              # fail pipeline if CRITICAL CVEs > this

# ── Override integrationTest with real tests (optional) ──────────────────────
# Remove this block to use the default no-op stub.
integrationTest:
  stage: integration-test
  needs: [promoteToIntegration]
  script:
    - source env.sh && source tags.sh
    - echo "Running integration tests for ${DOCKER_IMAGE}:${TAG}"
    # replace with your actual test command:
    # - pytest tests/integration/
    # - go test ./... -tags=integration test
  allow_failure: true
  tags:
    - kubernetes
