# ── Replica count ─────────────────────────────────────────────────────────────
replicaCount: 1

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: ghcr.io/chitender/hermes
  tag: "v0.1.0-rc.4"
  pullPolicy: IfNotPresent

imagePullSecrets: []

# ── Service account ───────────────────────────────────────────────────────────
serviceAccount:
  # Create a dedicated ServiceAccount.
  create: true
  # If empty, the release name is used.
  name: ""
  # Annotations on the ServiceAccount. Use this for Vault K8s auth role binding:
  #   vault.hashicorp.com/role: "vault-etcd-sync-role"
  annotations: {}

# ── RBAC ─────────────────────────────────────────────────────────────────────
rbac:
  create: true

# ── Operator settings ─────────────────────────────────────────────────────────
# Log verbosity: debug | info | warn | error
logLevel: info

# Leader election: set to true for HA deployments (replicaCount > 1).
leaderElection:
  enabled: false

# ── Pod security ──────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# ── Health probes ─────────────────────────────────────────────────────────────
probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# ── Metrics ───────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  port: 8080
  # Create a Prometheus ServiceMonitor (requires prometheus-operator CRDs).
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Labels to add to the ServiceMonitor so Prometheus discovers it.
    labels: {}

# ── Node scheduling ───────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Extra volumes ─────────────────────────────────────────────────────────────
# We fully replace the default SA token mount with a projected volume so we can
# control the JWT audience (required for Vault Kubernetes auth) and TTL.
#
# The projected volume must include ALL three sources that Kubernetes normally
# provides in /var/run/secrets/kubernetes.io/serviceaccount:
#   token     — JWT (short-lived, Vault audience)
#   ca.crt    — cluster CA; controller-runtime needs this to verify the API server
#   namespace — namespace file read by the client-go in-cluster config
#
# automountServiceAccountToken is set to false in the Deployment so Kubernetes
# does not also mount its own default SA volume at the same path.
extraVolumes:
  # Token 1: standard K8s API access (no audience = accepted by API server).
  # Provides ca.crt and namespace that controller-runtime needs.
  - name: kube-api-access
    projected:
      defaultMode: 0444
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
        - configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
        - downwardAPI:
            items:
              - path: namespace
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
  # Token 2: Vault-specific token with audience "vault".
  # Mounted at a separate path; vault/client.go reads from here for k8s auth.
  - name: vault-sa-token
    projected:
      defaultMode: 0444
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
            audience: vault

extraVolumeMounts:
  - name: kube-api-access
    mountPath: /var/run/secrets/kubernetes.io/serviceaccount
    readOnly: true
  - name: vault-sa-token
    mountPath: /var/run/secrets/vault
    readOnly: true

# ── Pod annotations ───────────────────────────────────────────────────────────
podAnnotations: {}
