# ── Replica count ─────────────────────────────────────────────────────────────
replicaCount: 1

# ── Image ─────────────────────────────────────────────────────────────────────
image:
  repository: 728921286627.dkr.ecr.us-east-1.amazonaws.com/dev/hermes
  tag: v0.1.0-rc.4"
  pullPolicy: IfNotPresent

imagePullSecrets:
- name: registry-secret

# ── Service account ───────────────────────────────────────────────────────────
serviceAccount:
  # Create a dedicated ServiceAccount.
  create: true
  # If empty, the release name is used.
  name: ""
  # Annotations on the ServiceAccount. Use this for Vault K8s auth role binding:
  #   vault.hashicorp.com/role: "vault-etcd-sync-role"
  annotations: {}

# ── RBAC ─────────────────────────────────────────────────────────────────────
rbac:
  create: true

# ── Operator settings ─────────────────────────────────────────────────────────
# Log verbosity: debug | info | warn | error
logLevel: info

# Leader election: set to true for HA deployments (replicaCount > 1).
leaderElection:
  enabled: false

# ── Pod security ──────────────────────────────────────────────────────────────
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

# ── Health probes ─────────────────────────────────────────────────────────────
probes:
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

# ── Metrics ───────────────────────────────────────────────────────────────────
metrics:
  enabled: true
  port: 8080
  # Create a Prometheus ServiceMonitor (requires prometheus-operator CRDs).
  serviceMonitor:
    enabled: false
    interval: "30s"
    scrapeTimeout: "10s"
    # Labels to add to the ServiceMonitor so Prometheus discovers it.
    labels: {}

# ── Node scheduling ───────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Extra volumes ─────────────────────────────────────────────────────────────
# Mount the K8s service account token as a projected volume with a short TTL
# so Vault Kubernetes auth always uses a fresh JWT.
extraVolumes:
  - name: vault-sa-token
    projected:
      sources:
        - serviceAccountToken:
            path: token
            expirationSeconds: 3600
            audience: vault

extraVolumeMounts:
  - name: vault-sa-token
    mountPath: /var/run/secrets/kubernetes.io/serviceaccount
    readOnly: true

# ── Pod annotations ───────────────────────────────────────────────────────────
podAnnotations: {}
