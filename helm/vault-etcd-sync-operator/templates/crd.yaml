---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultedcsyncs.sync.example.com
  labels:
    {{- include "vault-etcd-sync-operator.labels" . | nindent 4 }}
  annotations:
    # keep: Helm will never delete this CRD on `helm uninstall`, protecting
    # any VaultEtcdSync CRs and their data that exist in the cluster.
    # The CRD is still created/updated on every `helm install` and `helm upgrade`.
    "helm.sh/resource-policy": keep
    controller-gen.kubebuilder.io/version: v0.16.0
spec:
  group: sync.example.com
  names:
    kind: VaultEtcdSync
    listKind: VaultEtcdSyncList
    plural: vaultedcsyncs
    singular: vaultedcsync
    shortNames:
      - ves
    categories:
      - all
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: EtcdKey
          type: string
          jsonPath: .spec.etcdKey
        - name: Interval
          type: string
          jsonPath: .spec.syncInterval
        - name: Status
          type: string
          jsonPath: .status.lastSyncStatus
        - name: LastSync
          type: string
          jsonPath: .status.lastSyncTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: VaultEtcdSync syncs secrets from HashiCorp Vault into etcd
            as rendered JSON using a Go-template system.
          type: object
          required:
            - spec
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - vaultPaths
                - etcdKey
                - jsonTemplate
                - vaultRef
                - etcdRef
              properties:
                vaultPaths:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - path
                    properties:
                      path:
                        type: string
                      prefix:
                        type: string
                etcdKey:
                  type: string
                jsonTemplate:
                  type: string
                syncInterval:
                  type: string
                  default: "60s"
                vaultRef:
                  type: object
                  required:
                    - secretRef
                  properties:
                    secretRef:
                      type: string
                etcdRef:
                  type: object
                  required:
                    - secretRef
                    - endpoints
                  properties:
                    secretRef:
                      type: string
                    endpoints:
                      type: array
                      minItems: 1
                      items:
                        type: string
                    tlsSecretRef:
                      type: string
            status:
              type: object
              properties:
                lastSyncTime:
                  type: string
                lastSyncStatus:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
