{{- if (index .Values "installExampleCR" | default false) }}
---
# Example VaultEtcdSync CR — copy and customise before applying.
apiVersion: sync.example.com/v1alpha1
kind: VaultEtcdSync
metadata:
  name: gravity-staging-config
  namespace: {{ .Release.Namespace }}
spec:
  vaultPaths:
    - path: "secret/data/gravity/staging/postgres"
      prefix: ""
    - path: "secret/data/gravity/staging/mongo"
      prefix: ""
    - path: "secret/data/gravity/staging/azure"
      prefix: ""

  etcdKey: "/gravity/staging/app-config"

  jsonTemplate: |
    {
      "cloud": {
        "enabled": true,
        "connection": {
          "BUCKET": "{{ "{{" }} .P360_AZURE_STORAGE_ACCOUNT {{ "}}" }}",
          "ACCESS_KEY": "{{ "{{" }} .P360_AZURE_CLIENT_ID {{ "}}" }}",
          "SECRET_KEY": "{{ "{{" }} .P360_AZURE_CLIENT_SECRET {{ "}}" }}",
          "REGION": "us-east-1",
          "CLOUD_PROVIDER": "adls"
        }
      },
      "sqlalchemy": {
        "enabled": true,
        "connection": {
          "HOST": "postgresdb.gravity-staging",
          "PORT": 5432,
          "USERNAME": "{{ "{{" }} .POSTGRESQL_USERNAME {{ "}}" }}",
          "PASSWORD": "{{ "{{" }} .POSTGRESQL_PASSWORD {{ "}}" }}",
          "DATABASE": "dem",
          "POOL_SIZE": 10,
          "MAX_OVERFLOW": 20
        }
      },
      "pymongo": {
        "enabled": true,
        "connection": {
          "HOST": "test123",
          "PORT": 27017,
          "USERNAME": "{{ "{{" }} .MONGO_USERNAME {{ "}}" }}",
          "PASSWORD": "{{ "{{" }} .MONGO_PASSWORD {{ "}}" }}",
          "DATABASE": "dem",
          "POOL_SIZE": 10,
          "MAX_OVERFLOW": 20
        }
      }
    }

  syncInterval: "60s"

  vaultRef:
    secretRef: "{{ .Release.Namespace }}/vault-auth-secret"

  etcdRef:
    secretRef: "{{ .Release.Namespace }}/etcd-auth-secret"
    endpoints:
      - "https://etcd-0.etcd:2379"
      - "https://etcd-1.etcd:2379"
      - "https://etcd-2.etcd:2379"
    tlsSecretRef: "{{ .Release.Namespace }}/etcd-tls-secret"
{{- end }}
