{{/*
  Example secrets — NOT installed by default (rendered only as documentation).
  Copy these and fill in real values; do NOT commit secret values to source control.
  Use an external secrets manager (e.g. External Secrets Operator) to provision these.
*/}}
{{- if (index .Values "installExampleSecrets" | default false) }}
---
# Vault token auth example
apiVersion: v1
kind: Secret
metadata:
  name: vault-auth-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  authMethod: "token"
  vaultAddress: "https://vault.example.com"
  token: "REPLACE_ME"
---
# Vault userpass auth example (alternative)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: vault-auth-secret
#   namespace: {{ .Release.Namespace }}
# type: Opaque
# stringData:
#   authMethod: "userpass"
#   vaultAddress: "https://vault.example.com"
#   username: "vault-etcd-sync"
#   password: "REPLACE_ME"
#   mountPath: "userpass"
---
# Vault Kubernetes auth example (recommended for in-cluster deployments)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: vault-auth-secret
#   namespace: {{ .Release.Namespace }}
# type: Opaque
# stringData:
#   authMethod: "kubernetes"
#   vaultAddress: "https://vault.example.com"
#   vaultRole: "vault-etcd-sync-role"
#   mountPath: "kubernetes"
---
# etcd credentials
apiVersion: v1
kind: Secret
metadata:
  name: etcd-auth-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
---
# etcd TLS (optional — remove if etcd is not mTLS)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: etcd-tls-secret
#   namespace: {{ .Release.Namespace }}
# type: Opaque
# stringData:
#   ca.crt: |
#     -----BEGIN CERTIFICATE-----
#     REPLACE_ME
#     -----END CERTIFICATE-----
#   tls.crt: |
#     -----BEGIN CERTIFICATE-----
#     REPLACE_ME
#     -----END CERTIFICATE-----
#   tls.key: |
#     -----BEGIN EC PRIVATE KEY-----
#     REPLACE_ME
#     -----END EC PRIVATE KEY-----
{{- end }}
